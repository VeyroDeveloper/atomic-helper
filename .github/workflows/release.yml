name: Release AppImage

# Push a tag like v0.3.1 and this builds the AppImage and attaches it to a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches package.json
        run: |
          v=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - name: Build AppImage
        run: bash ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: AtomicHelper-x86_64.AppImage
          generate_release_notes: true
